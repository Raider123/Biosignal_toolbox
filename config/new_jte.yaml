# This is the parameter config file for offline training of ANN models to estimate joint torques using sEMG signals.
---
  filepath:
    data_path: 'data/jte/'
    emg_path: 'emg/BU62D/'
    emg_file_prefix: '24072025_BU62D_'
    quali_tsv_path: 'quali/BU62D/tsv/'
    quali_tsv_prefix: 'BU62D_'
    quali_path: [ 'quali/BU62D/torques/quali_torque_elbow_24_07_2025_', 'quali/BU62D/torques/quali_torque_shoulder_front_24_07_2025_', 'quali/BU62D/torques/quali_torque_shoulder_side_24_07_2025_' ]
    fig_save_path: 'data/test/'
    quali_torques_save_path: 'data/jte/quali_data/BU62D/torques'

  data_param:
    weights: ['1100g', '1850g']
    mov_type: [ 'grasp', 'complex']
    set_num: [ '1', '2', '3', '4' ]
    subject_code: [ 'BU62D' ]
    subject_weight: 80    #weight in kg
    subject_bio_sex: 'male'
    subject_hand_len: 113  #wrist to 3rd knuckle len in mm

  workflow_param:
    use_seed:               True
    seed:                   50
    model_train:            True
    old_preprocessing_mode: False
    input_mode:             "time" # options: "time", "freq", "time+freq", "time+temporal"
    model_dir:              "saved_models/TCN_MTL"

  preprocess_param:
    channel_names_emg:    ['BP1', 'BP2', 'BP3', 'BP4', 'BP5', 'BP6', 'BP7', 'BP8']
    channel_names_quali:  ['right', 'left']
    window_size_x:        50  #samples
    window_size_y:        50  # samples
    window_step:          25  #samples
    use_activation_fncn: False
    target_feature_select: 'mean'
    f_samp: 500
    f_cutoff_hpf: 15  #cutoff freq for bandpass
    f_cutoff_lpf: 200 #cutoff freq for bandpass
    filter_order: 2

    f_cutoff_sm_lpf: 5   #cutoff freq for smoothing
    sm_filter_order: 4   #filter order smoothing lpf

    filter_method:        'zero_phase'
    var_filter_width:     20
    normalisation_method:     'channel_wise_mvc'
    mvc:                  3.941259927517915e-06
      # BR07D: 4.569592924022451e-06
      # FW28D: 1.1657004817469086e-06
      # BU62D:  3.941259927517915e-06
      # WW06D: 0.09238221776255644
    act_delay:            25
    act_beta1:            0.25
    act_beta2:            0.05
    act_gamma:            0.7
    act_A:                -1.5

  model_param:
    n_epochs:             200
    batch_size:           32

    loss_fcn:             'mse' # mse
    optimizer:            'adam'

    train_test_split:     0.9
    validation_split:     0.1
    use_k_fold:           False
    k_fold_splits:        10
    k_fold_shuffle:       True
    shuffle_seed:         30

    is_early_stop:        True
    monitor:              'val_loss'
    min_delta:            0.0001
    patience:             10
    verbose:              0
    baseline:             null
    restore_best_weights: True

  post_processing_param:
    savitzky_window_length: 21
    savitzky_polyorder:    3
    moving_av_window_size: 40
    savitzky_on:           True
    moving_av_on:          False

  plot_param:
    is_plot_raw:          False
    is_plot_quali:        False
    is_plot_hpf:          False
    is_plot_var_filter:   False
    is_plot_smoothed:     False
    is_plot_act:          False
    is_plot_filt_win:     False
